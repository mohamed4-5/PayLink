services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylink_pass}
      POSTGRES_DB: ${POSTGRES_DB:-paylink_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-paylink} -d $${POSTGRES_DB:-paylink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-paylink}:${POSTGRES_PASSWORD:-paylink_pass}@db:5432/${POSTGRES_DB:-paylink_db}
    depends_on:
      db:
        condition: service_healthy